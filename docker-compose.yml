services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: veganos
      POSTGRES_PASSWORD: veganos
      POSTGRES_DB: veganos
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veganos -d veganos']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
