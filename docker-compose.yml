services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: temveg
      POSTGRES_PASSWORD: temveg
      POSTGRES_DB: temveg
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temveg -d temveg']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
